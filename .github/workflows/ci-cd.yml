# ──────────────────────────────────────────────────────────────────────────
# ci-cd.yml — FAKE push pipeline for the gitflow-release demo repo
#
# Mirrors the shape of the real premapp ci-cd.yml (changes → checks → builds
# → manifest → dispatch) but with dependency-free FAKE actions across six
# components: frontend, backend, infra, docs, bot (in-repo) + subcomponent
# (a git submodule pinned to master of strange-occurrences/dummy-service).
# No images are pushed; each "image" value is its component's git commit
# (the subcomponent uses the gitlink commit the submodule is pinned to).
#
# Pipeline:
#   changes ──→ frontend-check ─→ build-frontend ──┐
#           ├─→ backend-check  ─→ build-backend  ──┤
#           ├─→ bot-check      ─→ build-bot      ──┼── create-manifest ── dispatch-deploy
#           ├─→ infra-check    ─→ build-infra    ──┤   (echo-only)
#           ├─→ docs-check     ─→ build-docs     ──┤
#           └─→ (submodule)    ─→ submodule-component-check ─→ build-submodule-component ──┘
#
#   • push to dev     → only changed components build → dispatch report
#   • push to master  → full_rebuild: all components build → dispatch report
#   • workflow_dispatch → manual run with full_rebuild / perform_deploy
#
# Environment mapping:  master → prod,  everything else → dev
# ──────────────────────────────────────────────────────────────────────────

name: CI/CD (fake)

on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Force rebuild all components"
        required: false
        type: boolean
        default: false
      run_migration:
        description: "Run migration (fake flag)"
        required: false
        type: boolean
        default: false
      run_public_health_checks:
        description: "Run public health checks (fake flag)"
        required: false
        type: boolean
        default: false
      perform_deploy:
        description: "Run the (echo-only) deploy report"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ══════════════════════════════════════════════════════════════════════════
# JOBS
# ══════════════════════════════════════════════════════════════════════════

jobs:

  # ── changes ────────────────────────────────────────────────────────────
  # Path-detection gate. On master / workflow_dispatch / full_rebuild input,
  # every component is treated as changed (full rebuild of all gates); on a
  # dev push only paths-filter-detected components are. Also exports image_owner.
  # ────────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend:     ${{ steps.meta.outputs.frontend }}
      backend:      ${{ steps.meta.outputs.backend }}
      infra:        ${{ steps.meta.outputs.infra }}
      docs:         ${{ steps.meta.outputs.docs }}
      bot:          ${{ steps.meta.outputs.bot }}
      subcomponent: ${{ steps.meta.outputs.subcomponent }}
      image_owner:  ${{ steps.meta.outputs.image_owner }}
      full_rebuild: ${{ steps.meta.outputs.full_rebuild }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # paths-filter feeds the meta step; on full_rebuild the meta step forces all flags true.
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
            docs:
              - 'docs/**'
            bot:
              - 'bot/**'
            subcomponent:
              - 'subcomponent'
              - '.gitmodules'
      - id: meta
        run: |
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_owner=$OWNER" >> "$GITHUB_OUTPUT"
          # Full rebuild (=> every component treated as changed) on:
          #   push to master | any manual run (workflow_dispatch) | full_rebuild input
          FULL_REBUILD="false"
          if [ "$GITHUB_REF" = "refs/heads/master" ] \
             || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             || [ "${{ inputs.full_rebuild }}" = "true" ]; then
            FULL_REBUILD="true"
          fi
          echo "full_rebuild=$FULL_REBUILD" >> "$GITHUB_OUTPUT"
          # Effective "changed" per component = path-filter result, forced true on full rebuild.
          emit() {
            if [ "$FULL_REBUILD" = "true" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=$2" >> "$GITHUB_OUTPUT"
            fi
          }
          emit frontend     "${{ steps.filter.outputs.frontend }}"
          emit backend      "${{ steps.filter.outputs.backend }}"
          emit infra        "${{ steps.filter.outputs.infra }}"
          emit docs         "${{ steps.filter.outputs.docs }}"
          emit bot          "${{ steps.filter.outputs.bot }}"
          emit subcomponent "${{ steps.filter.outputs.subcomponent }}"

  # ── Quality gates ("check" group) ──────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────────

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/src/index.js

  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile backend/app/main.py

  bot-check:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check bot/src/index.js

  infra-check:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.5"
      - run: terraform -chdir=infra fmt -check -diff
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs have a Usage section
        run: grep -q '^## Usage' docs/README.md

  submodule-component-check:
    needs: changes
    if: needs.changes.outputs.subcomponent == 'true'
    runs-on: ubuntu-latest
    steps:
      # dummy-service is public → no SUBMODULE_PAT needed; recursive so the
      # check runs against the actual submodule content (also catches an
      # uninitialized submodule, which would leave subcomponent/ empty).
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Verify submodule service definition
        run: |
          set -euo pipefail
          test -f subcomponent/Dockerfile
          grep -q '^FROM ' subcomponent/Dockerfile
          test -s subcomponent/version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' subcomponent/version.txt
          grep -q '^services:' subcomponent/docker-compose.yml

  # ── Image builds ("build" group) ────────────────────────────────────────
  # Each build depends on its component's quality gate so a broken check
  # prevents the corresponding "image" from being produced.  Each job's
  # "image" value is its component's git commit (last commit touching the
  # folder); build-submodule-component uses the pinned submodule commit.
  # ────────────────────────────────────────────────────────────────────────

  build-frontend:
    needs: [changes, frontend-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.frontend-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -euo pipefail
          # image value = the git commit that last touched this component
          COMMIT="$(git log -1 --format=%H -- frontend/)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-frontend@$COMMIT"

  build-backend:
    needs: [changes, backend-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.backend-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -euo pipefail
          # image value = the git commit that last touched this component
          COMMIT="$(git log -1 --format=%H -- backend/)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-backend@$COMMIT"

  build-bot:
    needs: [changes, bot-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.bot-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -euo pipefail
          # image value = the git commit that last touched this component
          COMMIT="$(git log -1 --format=%H -- bot/)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-bot@$COMMIT"

  build-infra:
    needs: [changes, infra-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.infra-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -euo pipefail
          # image value = the git commit that last touched this component
          COMMIT="$(git log -1 --format=%H -- infra/)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-infra@$COMMIT"

  build-docs:
    needs: [changes, docs-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.docs-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -euo pipefail
          # image value = the git commit that last touched this component
          COMMIT="$(git log -1 --format=%H -- docs/)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-docs@$COMMIT"

  build-submodule-component:
    needs: [changes, submodule-component-check]
    if: "!cancelled() && (needs.changes.outputs.full_rebuild == 'true' || needs.submodule-component-check.result == 'success')"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      # dummy-service is public → no SUBMODULE_PAT needed; recursive in case
      # it ever nests its own submodules.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - id: build
        run: |
          set -euo pipefail
          # image value = "the used commit of the sub module" — the gitlink
          # commit the submodule is pinned to in this repo.
          COMMIT="$(git rev-parse HEAD:subcomponent)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Fake-built: ghcr.io/${{ needs.changes.outputs.image_owner }}/fakeapp-subcomponent@$COMMIT"

  # ── Release manifest ───────────────────────────────────────────────────
  # Captures all built image refs + deploy-policy flags into a single JSON
  # artifact, validated against infra/contracts/services.json.
  # ────────────────────────────────────────────────────────────────────────

  create-manifest:
    needs:
      [changes,
       frontend-check, backend-check, infra-check, docs-check, bot-check,
       submodule-component-check,
       build-frontend, build-backend, build-infra, build-docs, build-bot,
       build-submodule-component]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release manifest
        env:
          OWNER: ${{ needs.changes.outputs.image_owner }}
          FE: ${{ needs.build-frontend.outputs.commit }}
          BE: ${{ needs.build-backend.outputs.commit }}
          IN: ${{ needs.build-infra.outputs.commit }}
          DO: ${{ needs.build-docs.outputs.commit }}
          BO: ${{ needs.build-bot.outputs.commit }}
          SUB: ${{ needs.build-submodule-component.outputs.commit }}
        run: |
          set -euo pipefail
          # each image value is its component's git commit (subcomponent = pinned submodule commit)
          ref() { [ -n "$2" ] && echo "ghcr.io/$OWNER/fakeapp-$1@$2" || echo ""; }
          jq -n \
            --arg commit_sha "$GITHUB_SHA" \
            --arg branch "${GITHUB_REF#refs/heads/}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run_migration '${{ inputs.run_migration || false }}' \
            --argjson run_public_health_checks '${{ inputs.run_public_health_checks || false }}' \
            --argjson c_fe '${{ needs.changes.outputs.frontend }}' \
            --argjson c_be '${{ needs.changes.outputs.backend }}' \
            --argjson c_inf '${{ needs.changes.outputs.infra }}' \
            --argjson c_docs '${{ needs.changes.outputs.docs }}' \
            --argjson c_bot '${{ needs.changes.outputs.bot }}' \
            --argjson c_sub '${{ needs.changes.outputs.subcomponent }}' \
            --arg frontend "$(ref frontend "$FE")" \
            --arg backend  "$(ref backend  "$BE")" \
            --arg infra    "$(ref infra    "$IN")" \
            --arg docs     "$(ref docs     "$DO")" \
            --arg bot      "$(ref bot      "$BO")" \
            --arg subcomponent "$(ref subcomponent "$SUB")" \
            '{
              commit_sha: $commit_sha,
              branch: $branch,
              created_at: $created_at,
              run_migration: $run_migration,
              run_public_health_checks: $run_public_health_checks,
              changed: { frontend: $c_fe, backend: $c_be, infra: $c_inf, docs: $c_docs, bot: $c_bot, subcomponent: $c_sub },
              images: {
                "fakeapp-frontend": $frontend,
                "fakeapp-backend":  $backend,
                "fakeapp-infra":    $infra,
                "fakeapp-docs":     $docs,
                "fakeapp-bot":      $bot,
                "fakeapp-subcomponent": $subcomponent
              }
            }' > release-manifest.json

      - name: Validate manifest against services catalog
        run: |
          set -euo pipefail
          CATALOG=$(jq -c '[.services[].image] | sort' infra/contracts/services.json)
          MANIFEST=$(jq -c '.images | keys | sort' release-manifest.json)
          if [ "$CATALOG" != "$MANIFEST" ]; then
            echo "::error::release-manifest image keys drifted from infra/contracts/services.json"
            echo "catalog : $CATALOG"
            echo "manifest: $MANIFEST"
            exit 1
          fi
          cat release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  # ── Dispatch deploy (echo-only) ─────────────────────────────────────────
  # The real pipeline fires deploy.yml via `gh workflow run`.  This fake
  # version just downloads the manifest and reports what it would deploy.
  # ────────────────────────────────────────────────────────────────────────

  dispatch-deploy:
    needs: [create-manifest, infra-check]
    if: |
      always() &&
      needs.create-manifest.result == 'success' &&
      needs.infra-check.result != 'failure' &&
      contains(fromJson('["dev","master"]'), github.ref_name) &&
      (github.event_name != 'workflow_dispatch' || inputs.perform_deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Report (fake) deploy
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          ENV="dev"; [ "$BRANCH" = "master" ] && ENV="prod"
          echo "=== release-manifest.json ==="
          jq . release-manifest.json
          echo ""
          echo "Would dispatch deploy.yml → environment=$ENV commit=$GITHUB_SHA (echo-only: no deploy.yml in this demo)"

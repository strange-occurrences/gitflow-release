# ──────────────────────────────────────────────────────────────────────────
# alembic.ini — dummy Alembic config for the gitflow-release demo backend.
#
# Mirrors the real premapp backend layout (backend/aci/alembic/**) so the
# ci-cd.yml `migrations` paths-filter matches on the same glob. The dummy
# runtime database is a SQLite file created on first `alembic upgrade head`
# (demo.db) — it is a runtime artifact, never committed (see .gitignore.local).
# ──────────────────────────────────────────────────────────────────────────

[alembic]
# path to migration scripts; relative to this file's directory
script_location = alembic
# %(here)s = directory of this ini file → backend/aci/demo.db regardless of CWD
sqlalchemy.url = sqlite:///%(here)s/demo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
